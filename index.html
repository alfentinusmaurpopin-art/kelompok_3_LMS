<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - Kampus Terpadu Nusantara</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #111e38 0%, #1e3a8a 100%); padding:20px; }
  .box { background:#fff; border-radius:15px; width:100%; max-width:400px; padding:30px; }
  .logo { text-align:center; font-size:2.5rem; color:#2563eb; margin-bottom:10px; }
  h2 { text-align:center; color:#1e293b; margin-bottom:5px; font-size: 20px; }
  .subtitle { text-align:center; color:#64748b; font-size:.9rem; margin-bottom:20px; }
  .form-group { margin-bottom:15px; position: relative; }
  label { display:block; font-size:.85rem; color:#475569; margin-bottom:5px; font-weight:600; }
  .input-icon { position: absolute; left: 15px; top: 38px; color: #94a3b8; }
  input { width:100%; padding:12px 15px 12px 40px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:.95rem; outline:none; }
  input:focus { border-color:#2563eb; }
  .btn-submit { width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; margin-top:5px; }
  .btn-submit:hover { background:#1d4ed8; }
  .msg { text-align:center; margin-top:10px; font-size:.9rem; font-weight:600; padding:10px; border-radius:8px; display:none; }
  .msg.error { background:#fee2e2; color:#b91c1c; display:block; }
  .msg.success { background:#dcfce7; color:#15803d; display:block; }
  .hidden { display:none; }
  .toggle-text { text-align:center; margin-top:15px; font-size:.9rem; color:#64748b; }
  .toggle-text a { color:#2563eb; font-weight:bold; cursor:pointer; text-decoration:none; }
  .divider { text-align: center; color: #94a3b8; font-size: 12px; margin: 15px 0; }
  .btn-google { width: 100%; padding: 10px; background: white; border: 1.5px solid #cbd5e1; color: #334155; border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  /* SVG Google Logo */
  .btn-google svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="box">
  <div class="logo"><i class="fa-solid fa-layer-group"></i></div>
  <h2>Kampus Terpadu Nusantara</h2>
  <p class="subtitle">Layanan Pembelajaran Virtual</p>

  <div id="authMsg" class="msg"></div>

  <!-- LOGIN -->
  <div id="loginSection">
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>NIM / Email</label>
        <i class="fa-regular fa-user input-icon"></i>
        <input type="text" id="loginNim" placeholder="Masukkan NIM / Email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="loginPass" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-submit">Masuk</button>
    </form>
    
    <div class="divider">atau</div>
    
    <button onclick="loginGoogle()" class="btn-google">
      <!-- Google SVG Asli, Dijamin Muncul di HP -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Login dengan Google
    </button>
    
    <div class="toggle-text">
      Belum punya akun? <a onclick="toggleForm()">Daftar di sini</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div id="registerSection" class="hidden">
    <form id="registerForm" onsubmit="doRegister(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <i class="fa-regular fa-id-card input-icon"></i>
        <input type="text" id="regName" placeholder="Nama lengkap" required>
      </div>
      <div class="form-group">
        <label>NIM</label>
        <i class="fa-solid fa-hashtag input-icon"></i>
        <input type="text" id="regNim" placeholder="NIM" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <i class="fa-regular fa-envelope input-icon"></i>
        <input type="email" id="regEmail" placeholder="Email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="regPass" placeholder="Minimal 6 karakter" minlength="6" required>
      </div>
      <button type="submit" class="btn-submit">Daftar</button>
      <div class="toggle-text">
        Sudah punya akun? <a onclick="toggleForm()">Masuk</a>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATjBmA_HxZIIDk6IRuGyEuFErWbO8ApqA",
    authDomain: "ucb-lms-15e1c.firebaseapp.com",
    databaseURL: "https://ucb-lms-15e1c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ucb-lms-15e1c",
    storageBucket: "ucb-lms-15e1c.firebasestorage.app",
    messagingSenderId: "779828146972",
    appId: "1:779828146972:web:23516e45351885ea4b00d9",
    measurementId: "G-6LSD1QE262"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.toggleForm = function() {
    document.getElementById('loginSection').classList.toggle('hidden');
    document.getElementById('registerSection').classList.toggle('hidden');
    document.getElementById('authMsg').className = 'msg';
  }

  function showMsg(text, type) {
    const el = document.getElementById('authMsg');
    el.innerHTML = text;
    el.className = 'msg ' + type;
    setTimeout(() => { el.className = 'msg'; }, 5000);
  }

  window.doLogin = async function(e) {
    e.preventDefault();
    const inputUser = document.getElementById('loginNim').value.trim();
    const pass = document.getElementById('loginPass').value;

    try {
      const dbRef = ref(db);
      let user = null;
      let snapshot = await get(child(dbRef, `users/${inputUser}`));
      if (snapshot.exists()) {
        user = snapshot.val();
      } else {
        const allUsersSnapshot = await get(child(dbRef, 'users'));
        if (allUsersSnapshot.exists()) {
          const users = allUsersSnapshot.val();
          for (const nim in users) {
            if (users[nim].email === inputUser) { user = users[nim]; break; }
          }
        }
      }
      if (user) {
        if (user.pass === pass) {
          localStorage.setItem('ktn_currentUser', JSON.stringify(user));
          showMsg('Login berhasil!', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } else {
          showMsg('Password salah.', 'error');
        }
      } else {
        showMsg('NIM atau Email tidak ditemukan.', 'error');
      }
    } catch (error) {
      showMsg('Error: ' + error.message, 'error');
    }
  }

  window.doRegister = async function(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const nim = document.getElementById('regNim').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;

    try {
      const dbRef = ref(db);
      const snapshot = await get(child(dbRef, `users/${nim}`));
      if (snapshot.exists()) {
        showMsg('NIM sudah terdaftar.', 'error');
        return;
      }
      await set(ref(db, 'users/' + nim), { name: name, nim: nim, email: email, pass: pass, role: 'mahasiswa' });
      showMsg('Daftar berhasil! Silakan login.', 'success');
      document.getElementById('loginNim').value = nim;
      setTimeout(() => toggleForm(), 1500);
    } catch (error) {
      showMsg('Error: ' + error.message, 'error');
    }
  }

  window.loginGoogle = async function() {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      const dbRef = ref(db);
      const snapshot = await get(child(dbRef, 'users'));
      let existingUser = null;

      if (snapshot.exists()) {
        const users = snapshot.val();
        for (const nim in users) {
          if (users[nim].email === user.email) { existingUser = users[nim]; break; }
        }
      }

      if (existingUser) {
        localStorage.setItem('ktn_currentUser', JSON.stringify(existingUser));
        showMsg('Login Google berhasil!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        const tempNim = 'G-' + Math.floor(Math.random() * 1000000);
        const newUser = { name: user.displayName, email: user.email, nim: tempNim, pass: '-', role: 'mahasiswa' };
        await set(ref(db, 'users/' + tempNim), newUser);
        localStorage.setItem('ktn_currentUser', JSON.stringify(newUser));
        showMsg('Akun Google didaftarkan!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }
    } catch (error) {
      showMsg('Gagal Google: ' + error.message, 'error');
    }
  }
</script>
</body>
</html>
